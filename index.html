<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twilight</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-container flex flex-col h-screen transition-colors duration-300">
    <header class="bg-card shadow-md p-4 flex justify-between items-center transition-colors duration-300">
        <div class="flex items-center">
            <svg class="h-8 w-8 text-purple-600 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <h1 class="text-2xl font-bold text-primary">Twilight</h1>
        </div>
        <div id="auth-info" class="text-sm text-secondary flex items-center">
            <div id="auth-status-container" class="flex items-center space-x-2">
                <span id="user-id-display" class="font-mono bg-column rounded-md px-2 py-1 mr-2 text-primary">Not Logged In</span>
                <button id="login-button" class="bg-green-600 text-white px-4 py-2 rounded-lg font-semibold shadow-md hover:bg-green-700 transition-colors">Login</button>
                <button id="logout-button" class="bg-red-600 text-white px-4 py-2 rounded-lg font-semibold shadow-md hover:bg-red-700 transition-colors hidden">Logout</button>
            </div>
            <button id="settings-button" class="ml-4 hover:text-primary transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-secondary hover:text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </header>

    <main class="flex-grow p-6 overflow-hidden">
        <!-- Dashboard & Metrics Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-card p-6 rounded-lg shadow-md flex justify-between items-center transition-transform hover:scale-105 duration-200">
                <div>
                    <h2 class="text-sm font-medium text-secondary">Test Cases Passed</h2>
                    <p id="pass-count" class="text-3xl font-bold text-green-500">0</p>
                </div>
                <div class="text-green-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9 16.172l-4.172-4.172-1.414 1.414L9 19 21 7l-1.414-1.414z" />
                    </svg>
                </div>
            </div>
            <div class="bg-card p-6 rounded-lg shadow-md flex justify-between items-center transition-transform hover:scale-105 duration-200">
                <div>
                    <h2 class="text-sm font-medium text-secondary">Test Cases Failed</h2>
                    <p id="failed-count" class="text-3xl font-bold text-red-500">0</p>
                </div>
                <div class="text-red-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z" />
                    </svg>
                </div>
            </div>
            <div class="bg-card p-6 rounded-lg shadow-md flex justify-between items-center transition-transform hover:scale-105 duration-200">
                <div>
                    <h2 class="text-sm font-medium text-secondary">Test Cases On Hold</h2>
                    <p id="hold-count" class="text-3xl font-bold text-blue-500">0</p>
                </div>
                <div class="text-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14 19h-4V5h4v14zm6-14h-4v14h4V5zM4 5h4v14H4V5z" />
                    </svg>
                </div>
            </div>
            <div class="bg-card p-6 rounded-lg shadow-md flex justify-between items-center transition-transform hover:scale-105 duration-200">
                <div>
                    <h2 class="text-sm font-medium text-secondary">Total Defects</h2>
                    <p id="defect-count" class="text-3xl font-bold text-yellow-500">0</p>
                </div>
                <div class="text-yellow-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- Kanban Board -->
        <div id="board-container" class="flex flex-col lg:flex-row gap-4 h-full overflow-x-auto pb-4">
            <!-- New Task/Test Case/Defect Form -->
            <div class="w-full lg:w-1/6 flex-shrink-0">
                <div class="bg-card rounded-lg shadow-md p-6 sticky top-0">
                    <h2 class="text-xl font-bold mb-4 text-primary">Create Issue</h2>
                    <form id="task-form" class="space-y-4">
                        <div>
                            <label for="item-type" class="block text-sm font-medium text-secondary mb-1">Type</label>
                            <select id="item-type" class="w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500 bg-container text-primary p-2">
                                <option value="task">Task</option>
                                <option value="testCase">Test Case</option>
                                <option value="defect">Defect</option>
                            </select>
                        </div>
                        <div>
                            <label for="item-name" class="block text-sm font-medium text-secondary mb-1">Name</label>
                            <input type="text" id="item-name" required class="w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500 bg-container text-primary p-2">
                        </div>
                        <div>
                            <label for="assigned-to" class="block text-sm font-medium text-secondary mb-1">Assigned To</label>
                            <input type="text" id="assigned-to" required class="w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500 bg-container text-primary p-2">
                        </div>
                        <button type="submit" class="w-full bg-button text-white py-2 px-4 rounded-lg font-semibold shadow-md transition-colors">Add Issue</button>
                    </form>
                </div>
            </div>

            <div id="board-content" class="flex flex-row gap-4 h-full overflow-x-auto flex-grow">
                <!-- Columns will be dynamically generated here -->
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="modal-content rounded-lg shadow-xl p-6 w-full max-w-md transition-colors duration-300">
            <div class="flex justify-between items-center pb-4 mb-4 border-b">
                <h3 class="text-xl font-bold text-primary">Settings</h3>
                <button id="close-settings" class="text-secondary hover:text-primary">&times;</button>
            </div>
            <div class="space-y-6">
                <!-- View Mode Switch -->
                <div class="flex items-center justify-between">
                    <span class="text-primary font-medium">View Mode</span>
                    <div class="flex items-center space-x-2">
                        <button id="scrum-view-btn" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors border">Scrum</button>
                        <button id="kanban-view-btn" class="px-4 py-2 rounded-lg text-sm font-medium transition-colors border">Kanban</button>
                    </div>
                </div>
                <!-- Theme Switch -->
                <div class="flex items-center justify-between">
                    <span class="text-primary font-medium">Theme</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" value="" class="sr-only peer" id="theme-toggle" checked>
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-purple-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600"></div>
                        <span class="ml-3 text-sm font-medium text-gray-900 dark:text-gray-300">Light Mode</span>
                    </label>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
